name = "aethercloud-console"
compatibility_date = "2026-07-29"
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Both hostnames serve this Worker permanently; cloud.aetheriot.ai is primary
# and cloud.aetheriot.dev is kept, not pending removal.
#
# Every serving custom domain must be declared here. cloud.aetheriot.ai was
# once attached outside this file, which made it invisible to `wrangler
# deploy` and left a domain carrying real traffic exposed to being dropped by
# the next deploy.
[[routes]]
pattern = "cloud.aetheriot.ai"
custom_domain = true

[[routes]]
pattern = "cloud.aetheriot.dev"
custom_domain = true
